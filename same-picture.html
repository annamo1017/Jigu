<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>같은 그림 찾기</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Jua', system-ui, sans-serif;
    background: linear-gradient(180deg, #fff6d9 0%, #ffe3ec 100%);
    color: #5a3e2b;
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden; touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- 게임 화면 ---------- */
  header {
    width: 100%; max-width: 560px; display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px 2px; gap: 8px;
  }
  .pill {
    background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 22px;
    box-shadow: 0 3px 0 rgba(0,0,0,.07); min-width: 90px; text-align: center;
  }
  .pill.warn { color: #e0445e; animation: beat .5s infinite alternate; }
  @keyframes beat { to { transform: scale(1.08); } }
  .home { border: none; background: #fff; border-radius: 50%; width: 44px; height: 44px; font-size: 22px; box-shadow: 0 3px 0 rgba(0,0,0,.07); }
  .msg { font-size: 22px; height: 34px; margin: 4px 0 2px; text-align: center; }
  .board {
    flex: 1; width: 100%; max-width: 900px; display: flex; flex-direction: column;
    align-items: center; justify-content: space-evenly; padding: 0 12px 14px;
  }
  @media (orientation: landscape) { .board { flex-direction: row; } }
  .card {
    position: relative;
    width: min(40vh, 90vw, 420px); aspect-ratio: 1; border-radius: 50%;
    background: #fff; box-shadow: 0 8px 0 rgba(0,0,0,.08), 0 0 0 7px #fff, 0 0 0 11px var(--ring);
    transition: transform .35s cubic-bezier(.3,1.6,.5,1), box-shadow .2s;
  }
  @media (orientation: landscape) { .card { width: min(70vh, 45vw, 420px); } }
  .card.enter { transform: scale(.2) rotate(-40deg); }
  .card.done { box-shadow: 0 8px 0 rgba(0,0,0,.08), 0 0 0 7px #fff, 0 0 0 13px #7ccf6a; }
  .sym {
    position: absolute; transform: translate(-50%, -50%) rotate(var(--r));
    font-size: var(--s); line-height: 1;
    width: 1.3em; height: 1.3em; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; transition: background .2s, box-shadow .2s;
  }
  .sym.wrong { animation: wobble .45s; }
  .sym.found { background: #d9f5d0; box-shadow: 0 0 0 4px #7ccf6a; animation: pop .5s cubic-bezier(.3,1.8,.5,1) forwards; }
  .sym.right { background: #fff3a8; box-shadow: 0 0 0 5px #ffd84d; animation: pop .5s cubic-bezier(.3,1.8,.5,1) forwards; }
  .sym.hint { animation: glow 1.2s ease-in-out infinite; }
  @keyframes wobble {
    0%,100% { transform: translate(-50%,-50%) rotate(var(--r)); }
    25% { transform: translate(-50%,-50%) rotate(calc(var(--r) - 12deg)); }
    75% { transform: translate(-50%,-50%) rotate(calc(var(--r) + 12deg)); }
  }
  @keyframes pop {
    0% { transform: translate(-50%,-50%) rotate(var(--r)) scale(1); }
    60% { transform: translate(-50%,-50%) rotate(0deg) scale(1.25); }
    100% { transform: translate(-50%,-50%) rotate(0deg) scale(1.1); }
  }
  @keyframes glow {
    0%,100% { transform: translate(-50%,-50%) rotate(var(--r)) scale(1); }
    50% { transform: translate(-50%,-50%) rotate(var(--r)) scale(1.2); }
  }
  .confetti { position: fixed; pointer-events: none; font-size: 28px; z-index: 30; animation: fly 1.1s ease-out forwards; }
  @keyframes fly {
    0% { transform: translate(0,0) scale(.5); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(var(--rot)); opacity: 0; }
  }
  .sound {
    position: fixed; bottom: 10px; right: 10px; font-size: 20px; background: #fff; border: none; z-index: 40;
    border-radius: 50%; width: 42px; height: 42px; box-shadow: 0 3px 0 rgba(0,0,0,.08);
  }

  /* ---------- 덮개 화면 (시작 / 끝) ---------- */
  .screen {
    position: fixed; inset: 0; background: rgba(255,246,217,.97); z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 14px; text-align: center; padding: 28px 18px 70px; overflow-y: auto;
  }
  .screen h1 { font-size: 38px; margin: 6px 0 0; color: #e8698a; }
  .screen h2 { font-size: 22px; margin: 4px 0 0; }
  .screen p { font-size: 18px; margin: 0; line-height: 1.5; }
  .demo { font-size: 46px; }
  .choices { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .choice {
    border: 3px solid #f2c94c; background: #fff; color: #8a6420; border-radius: 18px;
    padding: 10px 14px; font-size: 18px; min-width: 92px;
  }
  .choice small { display: block; font-size: 13px; opacity: .8; margin-top: 2px; }
  .choice.on { background: #f2c94c; color: #fff; }
  .big {
    font-size: 30px; border: none; background: #6cc56c; color: #fff;
    padding: 14px 44px; border-radius: 999px; box-shadow: 0 6px 0 #4a9a4a;
  }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 #4a9a4a; }
  .sub { font-size: 18px; border: 3px solid #e8698a; color: #e8698a; background: #fff; padding: 8px 22px; border-radius: 999px; }
  .note { font-size: 13px; color: #a07a5a; min-height: 1em; }
  .screen .result { font-size: 50px; color: #e8698a; margin: 0; }
  .namebox { display: flex; gap: 8px; }
  .namebox input {
    font-family: inherit; font-size: 22px; padding: 8px 14px; border-radius: 14px; border: 3px solid #f2c94c;
    width: 170px; text-align: center; color: #5a3e2b; user-select: text; -webkit-user-select: text;
  }
  .namebox button { font-size: 20px; border: none; background: #e8698a; color: #fff; border-radius: 14px; padding: 8px 18px; }
  .rank {
    width: 100%; max-width: 360px; background: #fff; border-radius: 18px; padding: 10px 14px;
    box-shadow: 0 4px 0 rgba(0,0,0,.06); text-align: left;
  }
  .rank h3 { margin: 2px 0 6px; font-size: 18px; text-align: center; }
  .rank ol { margin: 0; padding: 0; list-style: none; }
  .rank li { display: flex; justify-content: space-between; padding: 5px 4px; font-size: 18px; border-bottom: 1px dashed #f0e2c8; }
  .rank li:last-child { border-bottom: none; }
  .rank li.me { background: #fff3a8; border-radius: 8px; }
  .rank .empty { text-align: center; color: #a07a5a; font-size: 15px; padding: 8px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .recordBadge {
    font-size: 26px; color: #fff; background: linear-gradient(90deg, #ff7aa2, #ffb340, #ffd84d, #7ccf6a, #6cc0ff, #b38cff);
    background-size: 300% 100%; padding: 10px 22px; border-radius: 999px;
    animation: rainbow 2s linear infinite, bounceIn .7s cubic-bezier(.3,1.8,.5,1);
    box-shadow: 0 5px 0 rgba(0,0,0,.1); text-shadow: 0 2px 0 rgba(0,0,0,.15);
  }
  @keyframes rainbow { to { background-position: 300% 0; } }
  @keyframes bounceIn { from { transform: scale(.2); } to { transform: scale(1); } }
  .screen.record .demo { font-size: 72px; animation: bounceIn .7s cubic-bezier(.3,1.8,.5,1), beat .6s .7s infinite alternate; }
  .screen.record h1 { font-size: 48px; }
  .screen.record .result { color: #ff7a00; }
  .rain { position: fixed; top: -60px; pointer-events: none; z-index: 35; animation: rain linear forwards; }
  @keyframes rain { to { transform: translateY(calc(100vh + 120px)) rotate(var(--rot)); } }
  .flash { position: fixed; inset: 0; background: #fff; z-index: 34; pointer-events: none; animation: flash .6s ease-out forwards; }
  @keyframes flash { from { opacity: .9; } to { opacity: 0; } }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- 시작 화면 -->
<div class="screen" id="startScreen">
  <div class="demo">🐶 🔍 🐶</div>
  <h1>같은 그림 찾기</h1>
  <p>위 동그라미와 아래 동그라미에<br>똑같은 그림이 딱 하나 있어요!<br>위에서 하나, 아래에서 하나 콕콕 👆👆</p>

  <h2>어떻게 놀까요?</h2>
  <div class="choices" id="modeChoices">
    <button class="choice on" data-mode="time">⏱️ 10문제<small>얼마나 빨리 풀까?</small></button>
    <button class="choice" data-mode="count">⏳ 60초<small>몇 개나 찾을까?</small></button>
  </div>

  <h2>그림 몇 개?</h2>
  <div class="choices" id="levelChoices">
    <button class="choice on" data-n="5">🐣 5개</button>
    <button class="choice" data-n="8">🐥 8개</button>
    <button class="choice" data-n="11">🦅 11개</button>
  </div>

  <button class="big" id="go">시작! ▶</button>
  <div class="note" id="voiceNote"></div>

  <div class="rank" id="startRank"></div>
</div>

<!-- 끝 화면 -->
<div class="screen hidden" id="endScreen">
  <div class="demo" id="endEmoji">👏😊👏</div>
  <h1 id="endTitle">잘했어요!</h1>
  <div class="recordBadge hidden" id="recordBadge">✨ 최고기록 경신! ✨</div>
  <p id="endLabel"></p>
  <p class="result" id="endResult"></p>
  <div class="namebox" id="nameBox">
    <input id="nameInput" maxlength="10" placeholder="이름" autocomplete="off">
    <button id="saveBtn">저장</button>
  </div>
  <div class="note" id="saveNote"></div>
  <div class="rank" id="endRank"></div>
  <div class="row">
    <button class="big" id="again">다시! 🔄</button>
    <button class="sub" id="toStart">처음으로</button>
  </div>
</div>

<!-- 게임 화면 -->
<header>
  <button class="home" id="homeBtn" aria-label="처음으로">🏠</button>
  <div class="pill" id="progress">⭐ 0/10</div>
  <div class="pill" id="clock">0.0초</div>
</header>
<div class="msg" id="msg">같은 그림을 찾아요!</div>
<div class="board">
  <div class="card" id="c0" style="--ring:#8fd3ff"></div>
  <div class="card" id="c1" style="--ring:#ffb3c7"></div>
</div>
<button class="sound" id="snd" aria-label="소리 켜기/끄기">🔊</button>

<script>
const SYMBOLS = [
  ['🍎','사과'],['🍌','바나나'],['🍓','딸기'],['🍉','수박'],['🍇','포도'],['🍕','피자'],
  ['🐶','강아지'],['🐱','고양이'],['🐰','토끼'],['🐻','곰'],['🐘','코끼리'],['🐧','펭귄'],
  ['🦆','오리'],['🐟','물고기'],['🐷','돼지'],['🐸','개구리'],['🦁','사자'],['🐢','거북이'],['🐝','꿀벌'],
  ['🚗','자동차'],['🚌','버스'],['✈️','비행기'],['🚂','기차'],['🎈','풍선'],['⭐','별'],['🌈','무지개'],
  ['🌸','꽃'],['☀️','해'],['🌙','달'],['🍦','아이스크림'],['🦋','나비'],['⚽','공']
];
const PRAISE = ['잘했어요!','최고예요!','맞았어요!','우와!','짝짝짝!'];
const ROUNDS = 10;      // 10문제 모드
const LIMIT = 60;       // 60초 모드 (초)
const SIZE = { 5: 17, 8: 13, 11: 10.5 }; // 카드 너비 대비 그림 크기(%)

const $ = id => document.getElementById(id);
const shuffle = a => { for (let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const rnd = (a, b) => a + Math.random() * (b - a);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

// ---------- 그림 자리 ----------
function ring(n, R, off) {
  const p = [];
  for (let i = 0; i < n; i++) { const a = off + i * 2 * Math.PI / n; p.push([50 + R * Math.cos(a), 50 + R * Math.sin(a)]); }
  return p;
}
function layout(n) {
  const off = Math.random() * Math.PI * 2;
  if (n === 5) return [[50, 50], ...ring(4, 30, off)];
  if (n === 8) return [[50, 50], ...ring(7, 32.5, off)];
  return [...ring(3, 13, off), ...ring(8, 35, off + .3)]; // 11개: 안쪽 3 + 바깥 8
}

// ---------- 효과음 ----------
let soundOn = true, ac = null;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume().catch(()=>{});
  return ac;
}
function tone(freq, start, dur, type='sine', vol=.18) {
  const a = audio(); if (!a || !soundOn) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, a.currentTime + start);
  g.gain.linearRampToValueAtTime(vol, a.currentTime + start + .02);
  g.gain.exponentialRampToValueAtTime(.001, a.currentTime + start + dur);
  o.connect(g).connect(a.destination);
  o.start(a.currentTime + start); o.stop(a.currentTime + start + dur + .05);
}
const yay  = () => [523,659,784,1047].forEach((f,i)=>tone(f, i*.09, .25, 'triangle'));
const ding = () => { tone(880, 0, .18, 'triangle'); tone(1175, .08, .22, 'triangle'); };
const boop = () => { tone(300, 0, .15, 'sine', .12); tone(250, .1, .2, 'sine', .1); };
const fanfare = () => [523,523,659,784,659,784,1047].forEach((f,i)=>tone(f, i*.13, .3, 'triangle', .2));

// ---------- 한국어 음성 ----------
// 1순위: Claude 음성(데스크톱 웹), 2순위: 기기 음성
let claudeTts = null;
const synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;
let koVoice = null;
function pickVoice() {
  if (!synth) return;
  let vs = []; try { vs = synth.getVoices() || []; } catch (e) {}
  const ko = vs.filter(v => /^ko/i.test(v.lang) || /korean|한국/i.test(v.name));
  koVoice = ko.find(v => /yuna|sora|female|여/i.test(v.name)) || ko.find(v => v.localService) || ko[0] || null;
}
if (synth) { pickVoice(); try { synth.addEventListener('voiceschanged', pickVoice); } catch (e) { synth.onvoiceschanged = pickVoice; } }
let speakTimer = null;
function deviceSay(text) {
  if (!synth) return;
  try {
    if (!koVoice) pickVoice();
    if (synth.speaking || synth.pending) synth.cancel();
    clearTimeout(speakTimer);
    speakTimer = setTimeout(() => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR'; if (koVoice) u.voice = koVoice;
      u.rate = .95; u.pitch = 1.25; u.volume = 1;
      synth.resume(); synth.speak(u);
    }, 60);
  } catch (e) {}
}
function say(text) {
  if (!soundOn) return;
  if (claudeTts) { claudeTts.speak(text, { language: 'ko', voice: 'airy', rate: 1.05 }).catch(() => {}); return; }
  deviceSay(text);
}
function unlockSpeech(text) {
  if (claudeTts) { say(text); return; }
  if (!synth) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR'; if (koVoice) u.voice = koVoice; u.rate = .95; u.pitch = 1.25;
    synth.cancel(); synth.speak(u);
  } catch (e) {}
}

// ---------- 상태 ----------
let mode = store.get('dobble.mode', 'time');
let level = store.get('dobble.level', 5);
if (![5, 8, 11].includes(level)) level = 5;
let playing = false, locked = true, common = null, lastCommon = null, found = [false, false];
let solved = 0, elapsed = 0, running = false, lastTick = 0, hintTimer = null, nextTimer = null;
let lastSavedId = null;

// ---------- 시계 ----------
function tick(now) {
  if (running) { elapsed += (now - lastTick) / 1000; }
  lastTick = now;
  if (playing) {
    updateHud();
    if (mode === 'count' && elapsed >= LIMIT) { endGame(); }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(t => { lastTick = t; tick(t); });
function setRunning(on) { lastTick = performance.now(); running = on; }

function updateHud() {
  if (mode === 'time') {
    $('progress').textContent = `⭐ ${solved}/${ROUNDS}`;
    $('clock').textContent = `${elapsed.toFixed(1)}초`;
    $('clock').classList.remove('warn');
  } else {
    const left = Math.max(0, LIMIT - elapsed);
    $('progress').textContent = `⭐ ${solved}개`;
    $('clock').textContent = `⏳ ${Math.ceil(left)}초`;
    $('clock').classList.toggle('warn', left <= 10);
  }
}

// ---------- 게임 ----------
function startGame() {
  audio();
  unlockSpeech('같은 그림을 찾아요!');
  $('startScreen').classList.add('hidden');
  $('endScreen').classList.add('hidden');
  solved = 0; elapsed = 0; playing = true; lastCommon = null;
  updateHud();
  newRound();
}

function newRound() {
  clearTimeout(hintTimer);
  locked = false; found = [false, false];
  const pool = shuffle(SYMBOLS.slice()).filter(s => s !== lastCommon);
  common = pool[0]; lastCommon = common;
  const k = level - 1;
  const a = [common, ...pool.slice(1, 1 + k)];
  const b = [common, ...pool.slice(1 + k, 1 + 2 * k)];
  // 같은 그림은 한쪽은 크게, 한쪽은 작게
  const big = rnd(1.25, 1.4), small = rnd(.6, .72);
  const bigFirst = Math.random() < .5;
  drawCard(0, a, bigFirst ? big : small);
  drawCard(1, b, bigFirst ? small : big);
  $('msg').textContent = '같은 그림을 찾아요!';
  setRunning(true);
  hintTimer = setTimeout(showHint, 15000);
}

function drawCard(ci, syms, commonScale) {
  const el = $('c' + ci);
  el.innerHTML = '';
  el.classList.remove('done');
  el.classList.add('enter');
  const w = el.clientWidth || 300;
  const pos = layout(level);
  shuffle(syms.slice()).forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'sym';
    d.textContent = s[0];
    const scale = s === common ? commonScale : rnd(.7, 1.3);
    d.style.left = pos[i][0] + '%'; d.style.top = pos[i][1] + '%';
    d.style.setProperty('--s', (w * SIZE[level] / 100 * scale) + 'px');
    d.style.setProperty('--r', rnd(-35, 35) + 'deg');
    d.style.zIndex = Math.round(10 - scale * 5); // 작은 그림이 위로
    d.addEventListener('pointerdown', e => { e.preventDefault(); tap(ci, d, s); });
    el.appendChild(d);
  });
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('enter')));
}

function tap(ci, el, s) {
  if (!playing || locked || found[ci]) return;
  audio();
  if (s === common) {
    found[ci] = true;
    el.classList.remove('hint'); el.classList.add('found');
    $('c' + ci).classList.add('done');
    if (found[0] && found[1]) {
      locked = true; setRunning(false); clearTimeout(hintTimer);
      solved++; updateHud();
      document.querySelectorAll('.sym.found').forEach(n => { n.classList.remove('found'); void n.offsetWidth; n.classList.add('right'); });
      const praise = PRAISE[Math.random() * PRAISE.length | 0];
      $('msg').textContent = `${common[0]} ${common[1]}! ${praise}`;
      yay(); say(`${common[1]}! ${praise}`);
      burst($('c0')); burst($('c1'));
      if (mode === 'time' && solved >= ROUNDS) { nextTimer = setTimeout(endGame, 1200); }
      else { nextTimer = setTimeout(newRound, 1300); }
    } else {
      ding();
      const other = ci === 0 ? '아래' : '위';
      $('msg').textContent = `${common[0]} 찾았다! ${other}에도 있어요 👀`;
      say(`${common[1]}! ${other}에서도 찾아봐요`);
    }
  } else {
    el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong');
    boop();
    $('msg').textContent = '음... 다시 찾아볼까요? 🤔';
  }
}

function showHint() {
  if (locked || !playing) return;
  document.querySelectorAll('.card').forEach((c, ci) => {
    if (found[ci]) return;
    c.querySelectorAll('.sym').forEach(n => { if (n.textContent === common[0]) n.classList.add('hint'); });
  });
  $('msg').textContent = '반짝반짝 하는 그림을 봐요 ✨';
}

function burst(el) {
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const bits = ['⭐','🌟','✨','🎉','💖','🎈'];
  for (let i = 0; i < 12; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.textContent = bits[Math.random() * bits.length | 0];
    c.style.left = (cx - 14) + 'px'; c.style.top = (cy - 14) + 'px';
    const ang = Math.random() * Math.PI * 2, dist = 80 + Math.random() * 110;
    c.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    c.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
    c.style.setProperty('--rot', (Math.random() * 360) + 'deg');
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 1200);
  }
}

function stopGame() {
  playing = false; locked = true; setRunning(false);
  clearTimeout(hintTimer); clearTimeout(nextTimer);
}

let pendingResult = null;
async function endGame() {
  if (!playing) return;
  stopGame();
  const value = mode === 'time' ? Math.round(elapsed * 10) / 10 : solved;
  const key = boardKey();
  pendingResult = { board: key, value };
  // 먼저 간단한 축하
  const scr = $('endScreen');
  scr.classList.remove('record');
  $('recordBadge').classList.add('hidden');
  $('endEmoji').textContent = '👏😊👏';
  $('endTitle').textContent = '잘했어요!';
  $('endLabel').textContent = `${mode === 'time' ? '⏱️ 10문제' : '⏳ 60초'} · 그림 ${level}개`;
  $('endResult').textContent = fmt(value);
  $('nameInput').value = store.get('dobble.name', '');
  $('nameBox').classList.remove('hidden');
  $('saveNote').textContent = '';
  lastSavedId = null;
  scr.classList.remove('hidden');
  $('endRank').innerHTML = '<div class="empty">기록 확인 중…</div>';

  // 지금까지 1등 기록과 비교
  const list = (await loadBoard(key)).sort(better);
  if (boardKey() !== key || scr.classList.contains('hidden')) return;
  const best = list[0];
  const isRecord = (mode === 'time' || value > 0) &&
    (!best || (mode === 'time' ? value < best.value : value > best.value));

  if (isRecord) {
    bigCelebrate(best);
  } else {
    fanfare();
    burst($('endEmoji'));
    say(mode === 'time' ? `다 찾았어요! ${Math.round(value)}초 걸렸어요! 잘했어요!` : `끝! ${value}개 찾았어요! 잘했어요!`);
  }
  showRank($('endRank'));
}

function bigCelebrate(prev) {
  const scr = $('endScreen');
  scr.classList.add('record');
  $('endEmoji').textContent = '🏆';
  $('endTitle').textContent = '신기록!';
  $('recordBadge').textContent = prev
    ? `✨ 최고기록 경신! (전 기록 ${fmt(prev.value)}) ✨`
    : '✨ 첫 번째 최고기록! ✨';
  $('recordBadge').classList.remove('hidden');
  // 번쩍 + 빵빠레 + 하늘에서 쏟아지는 별
  const f = document.createElement('div'); f.className = 'flash'; document.body.appendChild(f);
  setTimeout(() => f.remove(), 700);
  bigFanfare();
  say('우와! 신기록이에요! 최고예요!');
  const bits = ['⭐','🌟','✨','🎉','🎊','🏆','💖','🎈','🥇','🍭'];
  for (let i = 0; i < 90; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'rain';
      c.textContent = bits[Math.random() * bits.length | 0];
      c.style.left = rnd(-5, 100) + 'vw';
      c.style.fontSize = rnd(22, 46) + 'px';
      c.style.setProperty('--rot', rnd(-540, 540) + 'deg');
      const dur = rnd(2.2, 3.8);
      c.style.animationDuration = dur + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), dur * 1000 + 100);
    }, i * 45);
  }
  [0, 500, 1000].forEach(t => setTimeout(() => burst($('endEmoji')), t));
}

function bigFanfare() {
  const notes = [[523,0],[659,.12],[784,.24],[1047,.36],[784,.6],[1047,.72],[1319,.84],[1568,1.1]];
  notes.forEach(([f, t]) => { tone(f, t, .35, 'triangle', .22); tone(f / 2, t, .35, 'sine', .1); });
  [1.5, 1.62, 1.74, 1.86].forEach((t, i) => tone([1568, 1319, 1568, 2093][i], t, .4, 'triangle', .18));
}

function fmt(v) { return mode === 'time' ? `${v.toFixed(1)}초` : `${v}개`; }
function boardKey() { return `${mode}-${level}`; }

// ---------- 순위표 (탑 10) ----------
// 공유 저장소(db)가 있으면 여러 기기에서 함께, 없으면 이 기기에만 저장
let db = null;
const better = (a, b) => mode === 'time' ? (a.value - b.value || a.at - b.at) : (b.value - a.value || a.at - b.at);

async function loadBoard(key) {
  if (db) {
    try {
      const snap = await Promise.race([
        db.collection('scores').where('board', '==', key).get(),
        new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), 10000))
      ]);
      return snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .filter(r => typeof r.value === 'number' && typeof r.name === 'string');
    } catch (e) { /* 아래 로컬로 */ }
  }
  return store.get('dobble.scores.' + key, []);
}

async function saveScore(name, key, value) {
  const rec = { board: key, name, value, at: Date.now() };
  if (db) {
    try {
      const ref = db.collection('scores').doc();
      await ref.set(rec);
      return ref.id;
    } catch (e) { /* 로컬로 */ }
  }
  const list = store.get('dobble.scores.' + key, []);
  rec.id = 'L' + rec.at;
  list.push(rec);
  list.sort(better);
  store.set('dobble.scores.' + key, list.slice(0, 10));
  return rec.id;
}

async function showRank(el) {
  const key = boardKey();
  const title = `🏆 ${mode === 'time' ? '10문제 빨리 풀기' : '60초 많이 찾기'} · ${level}개`;
  el.innerHTML = `<h3>${title}</h3><div class="empty">불러오는 중…</div>`;
  const list = (await loadBoard(key)).sort(better).slice(0, 10);
  if (boardKey() !== key) return;
  if (!list.length) { el.innerHTML = `<h3>${title}</h3><div class="empty">아직 기록이 없어요. 첫 번째 주인공이 되어 봐요!</div>`; return; }
  const medal = i => ['🥇','🥈','🥉'][i] || `${i + 1}.`;
  el.innerHTML = `<h3>${title}</h3><ol>${list.map((r, i) =>
    `<li class="${r.id === lastSavedId ? 'me' : ''}"><span>${medal(i)} ${esc(r.name)}</span><span>${fmt(r.value)}</span></li>`
  ).join('')}</ol>`;
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

$('saveBtn').addEventListener('click', async () => {
  const name = $('nameInput').value.trim().slice(0, 10);
  if (!name) { $('saveNote').textContent = '이름을 써 주세요 ✏️'; $('nameInput').focus(); return; }
  if (!pendingResult) return;
  store.set('dobble.name', name);
  $('saveBtn').disabled = true;
  lastSavedId = await saveScore(name, pendingResult.board, pendingResult.value);
  pendingResult = null;
  $('saveBtn').disabled = false;
  $('nameBox').classList.add('hidden');
  $('saveNote').textContent = `${name} 기록 저장 완료! ✅`;
  $('nameInput').blur();
  showRank($('endRank'));
});
$('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('saveBtn').click(); });

// ---------- 화면 버튼 ----------
function syncChoices() {
  document.querySelectorAll('#modeChoices .choice').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  document.querySelectorAll('#levelChoices .choice').forEach(b => b.classList.toggle('on', +b.dataset.n === level));
  showRank($('startRank'));
}
$('modeChoices').addEventListener('click', e => {
  const b = e.target.closest('.choice'); if (!b) return;
  mode = b.dataset.mode; store.set('dobble.mode', mode); syncChoices();
});
$('levelChoices').addEventListener('click', e => {
  const b = e.target.closest('.choice'); if (!b) return;
  level = +b.dataset.n; store.set('dobble.level', level); syncChoices();
});
$('go').addEventListener('click', startGame);
$('again').addEventListener('click', startGame);
function toStart() {
  stopGame();
  $('endScreen').classList.add('hidden');
  $('startScreen').classList.remove('hidden');
  syncChoices();
}
$('toStart').addEventListener('click', toStart);
$('homeBtn').addEventListener('click', toStart);
$('snd').addEventListener('click', () => {
  soundOn = !soundOn; $('snd').textContent = soundOn ? '🔊' : '🔇';
  if (!soundOn) { try { synth && synth.cancel(); } catch (e) {} try { claudeTts && claudeTts.stop(); } catch (e) {} }
});
let rt; window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    if (playing && !locked && !found[0] && !found[1]) newRound();
  }, 300);
});

syncChoices();

// ---------- 공유 기능 연결 (있을 때만) ----------
setTimeout(() => {
  pickVoice();
  if (!claudeTts) {
    if (!synth) $('voiceNote').textContent = '이 화면에서는 음성이 안 나와요. 효과음만 나와요.';
    else if (!koVoice) $('voiceNote').textContent = '목소리가 안 나오면 사파리·크롬에서 열어 보세요.';
  }
}, 1200);
(function connect(tries) {
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('db').then(d => { if (d) { db = d; if (!playing) showRank($('startRank')); } }).catch(() => {});
    window.claude.use('tts').then(t => { if (t) { claudeTts = t; $('voiceNote').textContent = ''; } }).catch(() => {});
  } else if (tries > 0) setTimeout(() => connect(tries - 1), 250);
})(20);
</script>
