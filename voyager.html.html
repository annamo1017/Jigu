-events:none;animation:flash .65s forwards;background:#52ffbe44}@keyframes flash{to{opacity:0}}.flash.error{background:#ff416844}.toast{position:fixed;left:50%;top:13%;transform:translateX(-50%);z-index:90;padding:18px 24px;background:#0b3044;border:1px solid #6ceccf;border-radius:15px;color:#fff;font-weight:900;box-shadow:0 0 40px #00baff66;animation:toast 1.6s forwards;max-width:90vw;text-align:center}@keyframes toast{0%{opacity:0;transform:translate(-50%,-18px)}15%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}.burst{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:75}.spark{position:absolute;top:-10%;width:8px;height:16px;animation:fall 3.5s linear forwards}@keyframes fall{to{transform:translateY(120vh) rotate(780deg);opacity:0}}.mission-visual{display:flex;align-items:center;justify-content:center;gap:20px;min-height:95px;margin:0 0 10px;background:radial-gradient(ellipse,#1a446044,transparent 72%);font-size:55px}.mission-visual span{filter:drop-shadow(0 0 15px #72c5ff);animation:float 3.5s ease-in-out infinite}.mission-visual span:nth-child(2){animation-delay:-1.2s}.mission-visual span:nth-child(3){animation-delay:-2.4s}.launch-glow{position:fixed;inset:0;pointer-events:none;z-index:70;background:radial-gradient(circle at 50% 70%,#7deaff55,transparent 65%);animation:flash 1.4s forwards}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}

(()=>{'use strict';
let audioCtx=null,soundOn=false,drone=null,droneGain=null;function initAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch(e){soundOn=false}}function tone(freq,dur=.12,type='sine',vol=.07,delay=0){if(!soundOn||!audioCtx)return;let t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.001,vol),t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+.03)}function sound(kind){if(!soundOn)return;try{if(kind==='click')tone(510,.065,'sine',.035);if(kind==='wrong'){tone(220,.23,'sawtooth',.06);tone(155,.35,'triangle',.06,.12)}if(kind==='success'){[523,659,784,1046].forEach((n,i)=>tone(n,.25,'sine',.08,i*.1))}if(kind==='start'){[180,250,350,520,780].forEach((n,i)=>tone(n,.4,'sawtooth',.035,i*.11))}if(kind==='win'){[392,523,659,784,1046,1318].forEach((n,i)=>tone(n,.55,'triangle',.075,i*.16))}if(kind==='end'){tone(180,.8,'sawtooth',.08)}}catch(e){}}function ambient(on){if(!audioCtx)return;if(drone){try{drone.stop()}catch(e){}drone.disconnect();drone=null}if(!on||!soundOn)return;drone=audioCtx.createOscillator();droneGain=audioCtx.createGain();drone.type='sine';drone.frequency.value=58;droneGain.gain.value=.013;drone.connect(droneGain);droneGain.connect(audioCtx.destination);drone.start()}function setSound(){soundOn=!soundOn;if(soundOn)initAudio();ambient(soundOn);document.getElementById('soundToggle').textContent=soundOn?'🔊 소리 끄기':'🔇 소리 켜기';sound('click')}document.getElementById('soundToggle').addEventListener('click',setSound);document.addEventListener('pointerdown',e=>{if(e.target.closest('.btn')&&!e.target.closest('#soundToggle'))sound('click')});function fx(kind,message){let d=document.createElement('div');d.className='flash'+(kind==='wrong'?' error':'');document.body.append(d);setTimeout(()=>d.remove(),700);if(message){let t=document.createElement('div');t.className='toast';t.textContent=message;document.body.append(t);setTimeout(()=>t.remove(),1650)}}function confetti(){let b=document.createElement('div');b.className='burst';for(let i=0;i<85;i++){let x=document.createElement('i');x.className='spark';x.style.left=Math.random()*100+'%';x.style.background=['#69e7ff','#ffcd70','#86ffc6','#ff789e'][i%4];x.style.animationDelay=Math.random()*1.4+'s';x.style.animationDuration=2.3+Math.random()*2+'s';b.append(x)}document.body.append(b);setTimeout(()=>b.remove(),5500)}const visual=['🛰️','👨‍🚀','📡','🕵️','🌍','🌕','🪐','🚀','🪐','💿','✨','🔐'];

{title:'스푸트니크 신호 탈취',type:'choice',tag:'1957 · 최초의 인공위성',story:'관제소가 미확인 무선 신호를 포착했다. 신호의 발신국을 찾아 통신 채널을 확보하라.',question:'1957년 세계 최초의 인공위성 스푸트니크 1호를 발사한 국가는?',options:['미국','소련','영국','프랑스'],correct:1,code:'ORBIT',hint:'스푸트니크 쇼크를 겪은 나라는 미국이었다.',fact:'1957년 소련의 스푸트니크 1호 발사는 냉전 우주 경쟁의 전환점이 되었다.'},
{title:'보스토크 파일 복원',type:'choice',tag:'1961 · 인간 우주 비행',story:'우주비행사의 이름이 삭제된 극비 문서를 복구하라.',question:'1961년 보스토크 1호에 탑승하여 인류 최초로 지구 궤도를 비행한 인물은?',options:['닐 암스트롱','유리 가가린','존 글렌','마이클 콜린스'],correct:1,code:'VOSTOK',hint:'소련의 우주비행사이며 이름은 유리로 시작한다.',fact:'유리 가가린은 1961년 지구 궤도를 한 바퀴 도는 비행에 성공했다.'},
{title:'연대표 재조립',type:'order',tag:'우주 개발 역사 · 시간 배열',story:'적의 교란으로 사건 기록이 뒤섞였다. 사건을 오래된 순서대로 터치하라.',question:'다음 네 사건을 발생 순서대로 선택하시오.',items:[['아폴로 11호 달 착륙','1969'],['최초의 여성 우주비행','1963'],['스푸트니크 1호 발사','1957'],['유리 가가린 우주비행','1961']],correct:[2,3,1,0],code:'1957',hint:'1957 → 1961 → 1963 → 1969 순서다.',fact:'최초의 여성 우주비행사는 1963년 소련의 발렌티나 테레시코바였다.'},
{title:'가짜 뉴스 제거',type:'choice',tag:'냉전 정보전 · 오류 탐지',story:'정보기관이 섞어 놓은 가짜 보도 하나를 찾아 통신망에서 삭제하라.',question:'다음 보도 중 역사적 사실과 다른 것은?',options:['소련이 최초의 인공위성을 발사했다.','미국이 최초의 유인 달 착륙에 성공했다.','미국이 최초의 인간 우주비행에 성공했다.','우주 경쟁은 냉전과 밀접한 관련이 있었다.'],correct:2,code:'TRUTH',hint:'최초의 인간 우주비행은 보스토크 1호였다.',fact:'최초의 인간 우주비행은 소련이 달성했고, 최초의 유인 달 착륙은 미국이 달성했다.'},
{title:'궤도 계산실',type:'number',tag:'과학 작전 · 신호 지연',story:'달 착륙선과 교신하려면 전파가 달까지 이동하는 시간을 계산해야 한다.',question:'지구~달 거리 384,000 km, 전파 속력 300,000 km/s일 때 편도 전달 시간은 약 몇 초인가? 소수 첫째 자리까지 입력하시오.',correct:'1.3',code:'LUNAR',hint:'시간 = 거리 ÷ 속력 = 384000 ÷ 300000',fact:'전파는 빛과 거의 같은 속력으로 이동한다. 약 1.28초이므로 소수 첫째 자리로 1.3초다.'},
{title:'달 착륙선 긴급 점검',type:'choice',tag:'1969 · 달 착륙',story:'달 착륙선의 하강 단계가 시작되었다. 실제 역사 기록에 맞는 승무원을 선택하라.',question:'아폴로 11호에서 달 표면에 직접 내려간 두 우주비행사는?',options:['암스트롱과 올드린','암스트롱과 콜린스','올드린과 콜린스','세 사람 모두'],correct:0,code:'EAGLE',hint:'마이클 콜린스는 달 궤도의 사령선에 남았다.',fact:'닐 암스트롱과 버즈 올드린이 달에 내려갔고, 마이클 콜린스는 사령선을 조종했다.'},
{title:'우주선 중력 경보',type:'choice',tag:'과학 작전 · 자유낙하',story:'우주선이 궤도에서 떠 있는 것처럼 보인다. 원인을 정확히 분석해야 시스템이 정상화된다.',question:'지구 궤도를 도는 우주선 안에서 우주비행사가 떠 있는 듯 보이는 주된 이유는?',options:['지구 중력이 완전히 사라져서','우주선과 우주비행사가 함께 자유낙하해서','우주복이 중력을 차단해서','우주 공간에 산소가 없어서'],correct:1,code:'FREEFALL',hint:'궤도 운동 중에도 지구의 중력은 작용한다.',fact:'우주선과 우주비행사가 함께 자유낙하하므로 무중력과 비슷한 상태를 경험한다.'},
{title:'보이저의 출항 명령',type:'choice',tag:'1977 · 심우주 탐사',story:'달 착륙 이후 새로운 극비 작전이 시작되었다. 두 무인 탐사선이 태양계 바깥을 향해 출발한다. 발사 기록의 오류를 찾아라.',question:'1977년에 발사된 보이저 탐사선에 대한 올바른 설명은?',options:['보이저 1호가 보이저 2호보다 먼저 발사되었다.','보이저 2호가 먼저 발사되었지만 보이저 1호가 목성에 먼저 도착했다.','두 탐사선은 사람이 탑승한 우주선이다.','보이저 1호와 2호는 달 착륙선이다.'],correct:1,code:'VOYAGER',hint:'발사 순서와 행성에 도착한 순서는 반드시 같지 않다.',fact:'보이저 2호는 1977년 8월 20일, 보이저 1호는 9월 5일 발사되었다. 보이저 1호가 목성에는 먼저 도착했다.'},
{title:'행성 항로 해독',type:'order',tag:'보이저 2호 · 그랜드 투어',story:'보이저 2호의 항로 데이터가 섞였다. 실제로 근접 탐사한 네 행성을 방문 순서대로 선택해 경로를 복원하라.',question:'보이저 2호가 근접 탐사한 행성들을 순서대로 터치하시오.',items:[['해왕성','1989'],['목성','1979'],['천왕성','1986'],['토성','1981']],correct:[1,3,2,0],code:'NEPTUNE',hint:'태양에서 가까운 거대 행성부터 차례대로 목성, 토성, 천왕성, 해왕성이다.',fact:'보이저 2호는 목성(1979), 토성(1981), 천왕성(1986), 해왕성(1989)을 근접 탐사했다.'},
{title:'황금 음반의 암호',type:'choice',tag:'골든 레코드 · 인류의 메시지',story:'탐사선에 실린 금빛 원반을 발견했다. 우주로 보낸 이 물체의 정체를 해독해야 마지막 보안 장치가 열린다.',question:'보이저 1호와 2호에 실린 골든 레코드의 주된 목적은?',options:['탐사선의 연료를 저장하기 위해','외계 생명체가 발견할 가능성에 대비해 지구의 소리·음악·사진 등을 담기 위해','태양빛을 반사해 탐사선을 가속하기 위해','행성의 중력을 제거하기 위해'],correct:1,code:'EARTH',hint:'음악, 여러 언어의 인사말, 지구의 모습이 담겨 있다.',fact:'골든 레코드는 지구와 인류의 모습을 소개하는 메시지로, 두 보이저 탐사선에 실렸다.'},
{title:'성간 공간 긴급 통신',type:'choice',tag:'태양권 경계 · 탐사선 구별',story:'태양풍의 영향권을 벗어난 탐사선에서 신호가 왔다. 성간 공간에 먼저 진입한 탐사선을 찾아라.',question:'2012년 태양권계면을 넘어 성간 공간에 먼저 진입한 탐사선은?',options:['보이저 1호','보이저 2호','아폴로 11호','스푸트니크 1호'],correct:0,code:'INTERSTELLAR',hint:'보이저 2호는 2018년에 성간 공간에 진입했다.',fact:'보이저 1호는 2012년, 보이저 2호는 2018년 태양권계면을 넘어 성간 공간에 진입했다. 이는 태양의 중력권을 완전히 벗어났다는 뜻은 아니다.'},
{title:'최후의 보안 암호',type:'cipher',tag:'최종 단계 · 보안 해독',story:'달 착륙과 보이저 심우주 탐사 기록을 모두 복원했다. 이제 인류의 달 착륙을 상징하는 최종 암호를 입력해 관제센터를 탈출하라.',question:'최종 암호 형식: 달 착륙선 이름(영어 대문자) + 최초 유인 달 착륙 연도(4자리). 띄어쓰기 없이 입력하시오.',correct:'EAGLE1969',code:'MOON',hint:'아폴로 11호 달 착륙선 이름은 EAGLE, 달 착륙은 1969년이다.',fact:'아폴로 11호 달 착륙선 이글(Eagle)은 1969년 달 표면에 착륙했다.'}
];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;const limit=35*60;function reset(){ambient(soundOn);clearInterval(state.timer);state={...state,screen:'start',step:0,score:0,energy:100,hints:0,started:0,elapsed:0,selected:null,order:[],answer:'',feedback:'',done:false,logs:[],codes:[],timer:null};render()}function begin(){sound('start');fx('success','🚀 발사 시퀀스 시작!');state.started=Date.now();state.screen='play';state.timer=setInterval(()=>{state.elapsed=Math.floor((Date.now()-state.started)/1000);let e=$('#clock');if(e)e.textContent=fmt(Math.max(0,limit-state.elapsed));if(state.elapsed>=limit){finish(false)}},1000);render()}function top(){return `<div class="top"><span class="brand">◈ SPACE RACE // 1969–1977</span><span class="pill">${state.screen==='play'?'⏱ <span id="clock">'+fmt(Math.max(0,limit-state.elapsed))+'</span>':'MISSION CONTROL'}</span></div>`}function hud(){return `<div class="hud"><div class="stat"><b>${state.team==='USA'?'🇺🇸':'☭'} ${state.team==='USA'?'미국':'소련'}</b><span>${esc(state.name)}</span></div><div class="stat"><b>${state.score}</b><span>작전 점수</span></div><div class="stat"><b>${state.energy}%</b><span>우주선 에너지</span></div><div class="stat"><b>${state.step+1}/${missions.length}</b><span>진행 단계</span></div></div><div class="progress"><div style="width:${state.step/missions.length*100}%"></div></div>`}function render(){if(state.screen==='start'){app.innerHTML=top()+`<div class="hero"><div class="planet">🌕</div><span class="tag">TOP SECRET · CLASSROOM EDITION</span><h1>우주전쟁: 달에서 별까지</h1><p class="subtitle">미국 VS 소련 · 우주 관제센터 탈출 어드벤처<br>12개 미션을 통과해 달 착륙과 성간 탐사의 최종 암호를 복원하라!</p></div><div class="panel"><h2>🛰️ 작전 등록</h2><p class="mini">모둠당 태블릿 1대 · 약 25~35분 · 실제 역사 + 과학 추리</p><label for="teamname">모둠 이름</label><input id="teamname" class="input" maxlength="24" placeholder="예: 3학년 2반 우주탐사대" value="${esc(state.name)}"><p>진영 선택</p><div class="grid"><button class="btn choice ${state.team==='USA'?'selected':''}" data-team="USA"><span class="flag">🇺🇸</span><span>미국<br><small>APOLLO PROGRAM</small></span></button><button class="btn choice ${state.team==='USSR'?'selected':''}" data-team="USSR"><span class="flag">☭</span><span>소련<br><small>VOSTOK PROGRAM</small></span></button></div><div class="notice">⚠️ 역사적 사실은 두 진영에 동일하게 적용됩니다. 게임의 점수 경쟁은 가상 작전입니다. 정답 +100점, 오답 -15 에너지, 힌트 -20점. 제한 시간 35분.</div><button id="launch" class="btn primary" style="width:100%">🚀 작전 개시</button></div><div class="footer">이 게임은 한 기기에서 독립적으로 작동하며 실시간 공동 랭킹이나 점수 서버는 포함하지 않습니다.</div>`;$('#teamname').oninput=e=>state.name=e.target.value;document.querySelectorAll('[data-team]').forEach(b=>b.onclick=()=>{state.team=b.dataset.team;render()});$('#launch').onclick=()=>{state.name=$('#teamname').value.trim()||'무명 탐사대';begin()};return}if(state.screen==='end'){app.innerHTML=top()+`<div class="hero"><div class="planet">${state.done?'🌕':'🚨'}</div><h1>${state.done?'🌌 성간 탐사 작전 성공!':'작전 종료'}</h1><p class="subtitle">${state.done?'달 착륙과 보이저 탐사 기록 복원 완료! 모든 보안 관문을 통과했습니다.':'제한 시간 또는 에너지가 소진되었습니다.'}</p></div><div class="panel"><span class="tag">FINAL MISSION REPORT</span><h2>${esc(state.name)} · ${state.team==='USA'?'미국':'소련'}팀</h2><div class="hud"><div class="stat"><b>${state.score}</b><span>최종 점수</span></div><div class="stat"><b>${state.energy}%</b><span>남은 에너지</span></div><div class="stat"><b>${fmt(state.elapsed)}</b><span>소요 시간</span></div><div class="stat"><b>${state.step}/${missions.length}</b><span>완료 미션</span></div></div><div class="notice good">${state.done?'작전 코드: '+state.codes.join(' / '):'완료하지 못한 미션은 다시 도전해 보세요.'}</div><p class="text">🏆 우승 기준: 성공 여부 → 최종 점수 → 완료 시간 순서. 각 모둠은 이 화면을 교사에게 보여주세요.</p><div class="btnrow"><button class="btn primary" id="again">새 작전 시작</button><button class="btn" id="copy">결과 복사</button></div></div><div class="panel"><h3>역사적 결론</h3><p class="text">소련은 최초의 인공위성과 최초의 인간 우주 비행에서 앞섰고, 미국은 1969년 최초의 유인 달 착륙에 성공했습니다. 이후 미국이 발사한 보이저 1·2호는 외행성 탐사를 수행하고 성간 공간에 진입했습니다. 우주 경쟁은 냉전에서 시작되었지만, 그 탐사의 성과는 인류 모두의 과학적 자산이 되었습니다.</p></div>`;$('#again').onclick=reset;$('#copy').onclick=()=>{let s=`우주전쟁1969 | ${state.name} | ${state.team} | ${state.done?'성공':'실패'} | ${state.score}점 | ${fmt(state.elapsed)} | 에너지 ${state.energy}%`;navigator.clipboard?.writeText(s).then(()=>alert('결과를 복사했습니다.')).catch(()=>prompt('결과를 복사하세요',s))||prompt('결과',s)};return}let m=missions[state.step];let inner='';if(m.type==='choice'){inner=`<div class="grid">${m.options.map((v,i)=>`<button class="btn choice ${state.selected===i?'selected':''}" data-choice="${i}"><b>${'ABCD'[i]}</b><span>${esc(v)}</span></button>`).join('')}</div>`}else if(m.type==='order'){inner=`<p class="mini">선택한 순서: ${state.order.map(i=>esc(m.items[i][0])).join(' → ')||'아직 선택하지 않음'}</p><div class="timeline">${m.items.map((it,i)=>`<button class="btn tile ${state.order.includes(i)?'active':''}" data-order="${i}" ${state.order.includes(i)?'disabled':''}>${esc(it[0])}<small>${state.order.includes(i)?'선택됨':'선택하기'}</small></button>`).join('')}</div><button class="btn" id="clearorder" style="margin-top:10px">순서 초기화</button>`}else{inner=`<input id="typed" class="input" autocomplete="off" spellcheck="false" placeholder="${m.type==='number'?'예: 1.3':'비밀 암호 입력'}" value="${esc(state.answer)}">`}app.innerHTML=top()+hud()+`<div class="missionmap">${missions.map((_,i)=>`<div class="node ${i<state.step?'done':i===state.step?'current':''}">${i<state.step?'✓':i+1}</div>`).join('')}</div><div class="panel"><span class="tag">MISSION ${String(state.step+1).padStart(2,'0')} · ${esc(m.tag)}</span><h2 class="missionTitle">${esc(m.title)}</h2><div class="mission-visual"><span>${visual[state.step]}</span><span>${state.step>=7?'🌌':'🚀'}</span><span>${state.step>=7?'📡':'🌕'}</span></div><p class="text">${esc(m.story)}</p><div class="signal">${state.done?'UNLOCKED':'ACCESS LOCKED'}</div><h3>${esc(m.question)}</h3>${inner}${state.feedback?`<div class="notice ${state.feedback.startsWith('✓')?'good':'bad'}" role="status">${esc(state.feedback)}</div>`:''}<div class="btnrow"><button class="btn primary" id="submit">🔐 보안 인증</button><button class="btn" id="hint">💡 힌트 (-20점)</button></div></div><div class="panel"><h3>🔎 확보한 기밀 코드</h3><p class="mini">미션을 통과할 때마다 코드가 기록됩니다. 마지막 암호를 푸는 데 활용하세요.</p><div class="signal">${state.codes.length?state.codes.map(esc).join(' · '):'— · — · —'}</div></div><div class="footer">※ 문제는 역사적 사실에 기반하며 게임 속 작전 상황은 허구입니다. 태블릿에서 뒤로 가기 대신 게임 내 버튼을 사용하세요.</div>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.selected=+b.dataset.choice;state.feedback='';render()});document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{state.order.push(+b.dataset.order);state.feedback='';render()});if($('#clearorder'))$('#clearorder').onclick=()=>{state.order=[];render()};if($('#typed'))$('#typed').oninput=e=>state.answer=e.target.value;$('#hint').onclick=()=>{state.score=Math.max(0,state.score-20);state.hints++;state.feedback='💡 '+m.hint;render()};$('#submit').onclick=submit}
function submit(){let m=missions[state.step];if(m.type==='choice'&&state.selected===null){state.feedback='선택지를 먼저 선택하세요.';render();return}if(m.type==='order'&&state.order.length!==m.items.length){state.feedback='사건을 모두 선택하세요.';render();return}let val=m.type==='choice'?state.selected:m.type==='order'?state.order.join(','):(($('#typed')?.value||state.answer).trim().toUpperCase().replace(/\s/g,''));let correct=m.type==='order'?val===m.correct.join(','):val===m.correct;if(correct){sound('success');fx('success','🔓 보안 해제 · +100점');state.score+=100;state.codes.push(m.code);state.logs.push(m.title);state.feedback='✓ 인증 성공! '+m.fact+' 확보한 코드: '+m.code;state.selected=null;state.order=[];state.answer='';let prev=state.step;state.step++;if(state.step>=missions.length){state.score+=Math.max(0,Math.floor((limit-state.elapsed)/30));finish(true);return}render();let panel=$('.panel');if(panel){let n=document.createElement('div');n.className='notice good';n.innerHTML=`<b>✓ 이전 미션 완료</b><br>${esc(m.fact)}<br>획득 코드: <b>${esc(m.code)}</b>`;panel.prepend(n)} }else{sound('wrong');fx('wrong','⚠️ 인증 실패 · 에너지 -15%');state.energy=Math.max(0,state.energy-15);state.score=Math.max(0,state.score-10);state.feedback='⚠️ 인증 실패! 에너지 -15%. 단서를 다시 확인하세요.';if(state.energy<=0){finish(false);return}render()}}function finish(success){if(state.screen==='end')return;clearInterval(state.timer);state.elapsed=Math.min(limit,Math.floor((Date.now()-state.started)/1000));state.done=success;state.screen='end';render();ambient(false);if(success){sound('win');confetti()}else sound('end')}render();})();
</script></body></html>
