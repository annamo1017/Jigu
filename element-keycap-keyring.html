<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원소기호 키캡 키링 만들기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e4e2dc;--accent:#2f6fde;--ok:#1f9d61}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:24px 18px 60px}
h1{margin:0;font-size:26px;font-weight:900}
.sub{color:var(--muted);margin:4px 0 18px;font-size:14px}
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps span{flex:1;text-align:center;font-size:13px;padding:6px 0;border-radius:999px;background:#ebe9e3;color:var(--muted);font-weight:700}
.steps span.on{background:var(--ink);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
.qnum{font-size:13px;color:var(--muted)}
.prog{height:8px;background:#eeede8;border-radius:6px;overflow:hidden;margin:8px 0 18px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#2f6fde,#7a4fd6);transition:width .3s}
.q{font-size:22px;font-weight:700;margin:0 0 8px}
.choice{display:block;width:100%;text-align:left;font:inherit;font-size:18px;padding:18px 20px;margin:12px 0;border:2px solid var(--line);border-radius:16px;background:#fff;cursor:pointer}
.choice:hover{border-color:var(--accent);background:#f5f8ff}
.back{font:inherit;font-size:13px;border:0;background:none;color:var(--muted);cursor:pointer;padding:0}
.center{text-align:center}
.emo{font-size:68px;line-height:1.2}
.tag{color:var(--muted);font-size:14px;letter-spacing:1px}
h2{font-size:30px;margin:4px 0 6px}
.words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.words span{border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-size:20px;font-weight:700;background:#fff}
.big{font:inherit;font-size:20px;font-weight:900;padding:14px 30px;border-radius:14px;border:0;background:linear-gradient(135deg,#ff7a59,#f0b429);color:#fff;cursor:pointer;box-shadow:0 4px 0 #c9661c;margin-top:8px}
.big:disabled{background:#ccc;box-shadow:none;cursor:default}
.ghost{font:inherit;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;margin:4px}
.wheelWrap{position:relative;width:340px;height:340px;margin:10px auto}
.wheelWrap svg{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.17,.67,.12,1)}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--ink);z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.hub{position:absolute;top:50%;left:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#fff;border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:24px}
.keyring{display:flex;gap:6px;padding:14px;background:#3a3a40;border-radius:16px;width:max-content;margin:16px auto;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.cap{width:84px;height:84px;border-radius:12px;background:linear-gradient(#2c2c31,#1c1c20);border:3px solid #111;display:flex;align-items:center;justify-content:center;color:#fff;font-size:42px;font-weight:700}
.cap.pic{font-size:32px}
.recipe{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.syl{border:1px solid var(--line);border-radius:12px;padding:8px 14px;text-align:center;min-width:96px;background:#fff}
.syl b{font-size:28px;display:block}
.syl span{font-size:15px;color:var(--muted)}
.peel{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.peel span{border:2px solid var(--ink);border-radius:8px;padding:4px 10px;font-size:20px;font-weight:900;background:#fff}
.peel span small{font-size:13px;font-weight:700;color:var(--muted);margin-left:2px}
.box{background:#f1f0ec;border-radius:14px;padding:14px 16px;margin-top:14px;text-align:left;font-size:15px}
.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@media(max-width:480px){.wheelWrap{width:290px;height:290px}.cap{width:64px;height:64px;font-size:32px}}
.cap.el{position:relative;color:#1d1d1f;border:3px solid rgba(0,0,0,.15);background:#fff}
.cap.el .no{position:absolute;top:5px;left:8px;font-size:13px;font-weight:700;color:#1d1d1f}
.cap.el .sym{font-size:38px;font-weight:900}
.keyring{background:#e9e6df}
.row2{display:flex;gap:8px;margin-bottom:12px}
.mode{flex:1;font:inherit;font-size:15px;font-weight:700;padding:12px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer}
.mode.on{border-color:var(--ink);background:var(--ink);color:#fff}
.fin{font:inherit;font-size:28px;font-weight:900;letter-spacing:4px;text-transform:uppercase;padding:10px 16px;border:2px solid var(--line);border-radius:14px;width:100%;max-width:340px;text-align:center}
.fin:focus{outline:none;border-color:var(--accent)}
.opt{display:flex;align-items:center;gap:12px;justify-content:space-between;border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin:10px 0;background:#fff;cursor:pointer;text-align:left;width:100%;font:inherit}
.opt:hover{border-color:var(--accent)}
.opt .mini{display:flex;gap:4px}
.opt .mini span{width:44px;height:44px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:18px;line-height:1;position:relative}
.opt .mini span small{font-size:9px;font-weight:700;position:absolute;top:3px;left:4px}
.opt .why{font-size:12px;color:var(--muted)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.dwords{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.dw{font:inherit;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.dw:hover{border-color:var(--accent);background:#f5f8ff}
.dw b{font-size:17px;letter-spacing:1px}.dw span{font-size:13px}.dw small{font-size:11px;color:var(--muted)}
.ghost.dc.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.vkb{margin:12px auto 0;max-width:460px;display:flex;flex-direction:column;gap:5px}
.vkb div{display:flex;gap:4px;justify-content:center}
.vk{font:inherit;font-weight:700;font-size:16px;flex:1;max-width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;padding:0}
.vk:active{background:#e8eefc}
.vk.wide{max-width:none;flex:0 0 auto;padding:0 14px;font-size:14px}
.ptwrap{overflow-x:auto;margin:10px -12px 0;padding:0 2px 6px}
.ptgrid{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));grid-template-rows:repeat(7,auto) 10px repeat(2,auto);gap:2px;min-width:600px}
.pt{width:100%;aspect-ratio:1/1.12;border:1px solid rgba(0,0,0,.12);border-radius:5px;font:inherit;padding:1px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;position:relative}
.pt:hover{outline:2px solid var(--ink);z-index:2}
.pt small{font-size:8px;position:absolute;top:2px;left:3px}
.pt b{font-size:13px}.pt i{font-style:normal;font-size:7.5px;color:#555;white-space:nowrap;overflow:hidden;max-width:100%}
.ptgap{font-size:8px;color:var(--muted);display:flex;align-items:center;justify-content:center;border:1px dashed #ccc;border-radius:5px;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-size:13px;margin:6px 0}
.legend span{display:flex;align-items:center;gap:5px}.legend i{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.2)}
#elModal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.elcard{background:#fff;border-radius:20px;padding:22px;max-width:360px;width:100%;text-align:center;position:relative}
.elcard .x{position:absolute;top:10px;right:12px;border:0;background:none;font-size:18px;cursor:pointer}
.eltile{width:96px;height:104px;margin:0 auto;border-radius:12px;border:2px solid rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;position:relative}
.eltile small{position:absolute;top:6px;left:9px;font-weight:700}.eltile b{font-size:44px}
.elcard h3{margin:12px 0 6px;font-size:22px}.elcard h3 span{font-size:14px;color:var(--muted);font-weight:500}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.chips span{font-size:12px;padding:3px 9px;border-radius:999px;background:#f1f0ec;border:1px solid rgba(0,0,0,.08)}
.elcard p{font-size:15px;margin:12px 0 4px}
.wcloud{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-height:360px;overflow-y:auto;padding:4px}
.wchip{border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-weight:800;font-size:15px;background:#fff;letter-spacing:.5px}
.wchip small{font-weight:500;font-size:11px;color:var(--muted);margin-left:4px;letter-spacing:0}
.wchip.star{border:2px solid #f0b429;background:#fff8e6}
.picker{user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer;margin:10px auto;max-width:520px;min-height:300px;border-radius:24px;background:linear-gradient(135deg,#2b2d42,#3f3d72);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-shadow:0 10px 30px rgba(43,45,66,.35)}
.pword{font-size:64px;font-weight:900;letter-spacing:6px;line-height:1.1}
.pmean{font-size:18px;opacity:.85;margin-top:6px;min-height:26px}
.pseg{margin-top:14px;background:#fff;border-radius:12px;padding:6px 14px;font-size:26px;font-weight:900}
.pseg i{font-style:normal;color:#aaa;margin:0 4px}
.ptap{margin-top:22px;font-size:17px;font-weight:700;opacity:.9;animation:blink 1s infinite}
.picker.done{background:linear-gradient(135deg,#ff7a59,#f0b429)}
.picker.done .ptap{animation:none}
@keyframes blink{50%{opacity:.35}}
@media(max-width:480px){.pword{font-size:44px;letter-spacing:3px}}
</style>
</head>
<body>
<main>
  <h1>⚗️ 원소기호 키캡 키링</h1>
  <p class="sub">주기율표를 둘러보고, 성향 테스트나 내 단어로 원소기호 키링을 만들어요</p>
  <div class="row2"><button class="mode on" id="mTable">🧪 주기율표</button><button class="mode" id="mTest">🧭 성향 테스트로 추천받기</button><button class="mode" id="mFree">✏️ 내 단어·이니셜로 만들기</button></div>
  <div class="steps"><span id="s1">① 성향 테스트</span><span id="s2">② 추천 단어</span><span id="s3">③ 단어 뽑기</span><span id="s4">④ 만들기</span></div>
  <div class="card" id="app"></div>
</main>
<script>
const TYPES={"C-E-P": ["⚗️", "반응 설계자", "물질이 변하는 순간을 직접 일으켜 보고 그 규칙을 찾아내는 타입", [["BOND", "결합", ["B", "O", "Nd"], 0], ["BURN", "불에 타다", ["B", "U", "Rn"], 0], ["FIRE", "불", ["F", "I", "Re"], 0], ["BREW", "끓여 만들다", ["B", "Re", "W"], 0], ["POP", "펑! 터지다", ["P", "O", "P"], 1]]], "C-E-A": ["🧂", "생활 화학자", "부엌과 실험실을 오가며 화학을 생활에 써먹는 타입", [["COOK", "요리하다", ["C", "O", "O", "K"], 1], ["BACON", "베이컨", ["Ba", "C", "O", "N"], 2], ["CHEF", "요리사", ["C", "He", "F"], 0], ["CRISP", "바삭한", ["Cr", "I", "S", "P"], 0], ["SCOOP", "한 숟갈", ["S", "Co", "O", "P"], 1]]], "C-O-P": ["🔬", "입자 탐정", "눈에 보이지 않는 원자의 구조를 끝까지 파고드는 타입", [["CORE", "핵심", ["C", "O", "Re"], 1], ["CATION", "양이온", ["Ca", "Ti", "O", "N"], 0], ["CARBON", "탄소", ["Ca", "Rb", "O", "N"], 0], ["PURE", "순수한", ["P", "U", "Re"], 1], ["NEON", "네온", ["Ne", "O", "N"], 0]]], "C-O-A": ["🎆", "물질 감별사", "섞여 있는 물질을 꼼꼼히 관찰해 가려내는 타입", [["IRON", "철", ["Ir", "O", "N"], 0], ["COPPER", "구리", ["Co", "P", "P", "Er"], 0], ["GAS", "기체", ["Ga", "S"], 0], ["BASIC", "염기성의", ["Ba", "S", "I", "C"], 2], ["COINS", "동전들", ["Co", "I", "N", "S"], 2]]], "P-E-P": ["🎯", "힘의 해결사", "밀고 당기고 굴려 보며 힘의 법칙을 증명하는 타입", [["PUSH", "밀다", ["P", "U", "S", "H"], 1], ["SPIN", "회전하다", ["S", "P", "I", "N"], 1], ["CRASH", "충돌", ["C", "Ra", "S", "H"], 1], ["KICK", "차다", ["K", "I", "C", "K"], 0], ["BRAKES", "브레이크", ["B", "Ra", "K", "Es"], 0]]], "P-E-A": ["⚡", "전기 발명가", "전선과 자석으로 뭐든 만들어 보는 타입", [["WIRE", "전선", ["W", "I", "Re"], 0], ["SPARK", "불꽃", ["S", "P", "Ar", "K"], 0], ["FUSE", "퓨즈", ["F", "U", "Se"], 0], ["CHIP", "반도체 칩", ["C", "H", "I", "P"], 0], ["TECH", "기술", ["Te", "C", "H"], 0]]], "P-O-P": ["🌈", "파동 관찰자", "빛과 소리의 움직임을 섬세하게 관찰하는 타입", [["BEAM", "광선", ["Be", "Am"], 0], ["PRISM", "프리즘", ["Pr", "I", "Sm"], 0], ["SONIC", "소리의", ["S", "O", "Ni", "C"], 0], ["BASS", "낮은 음", ["Ba", "S", "S"], 1], ["HISS", "쉬익 소리", ["H", "I", "S", "S"], 0]]], "P-O-A": ["🚀", "에너지 엔지니어", "에너지가 어디서 어디로 가는지 따져 보고 활용하는 타입", [["HEAT", "열", ["He", "At"], 0], ["POWER", "힘·전력", ["P", "O", "W", "Er"], 1], ["MOTION", "운동", ["Mo", "Ti", "O", "N"], 0], ["FLY", "날다", ["Fl", "Y"], 0], ["FLASH", "번쩍임", ["F", "La", "S", "H"], 1]]], "L-E-P": ["🧬", "유전 연구원", "세대를 이어 전해지는 형질의 비밀을 실험으로 밝히는 타입", [["GENE", "유전자", ["Ge", "Ne"], 0], ["CLONE", "복제", ["Cl", "O", "Ne"], 0], ["BIRTH", "탄생", ["B", "Ir", "Th"], 0], ["BORN", "태어난", ["B", "O", "Rn"], 0], ["GENIUS", "천재", ["Ge", "Ni", "U", "S"], 0]]], "L-E-A": ["🌱", "광합성 농부", "식물을 직접 기르며 생명의 에너지를 탐구하는 타입", [["SUN", "태양", ["S", "U", "N"], 0], ["HERB", "허브", ["He", "Rb"], 1], ["LIFE", "생명", ["Li", "Fe"], 0], ["FERN", "고사리", ["Fe", "Rn"], 1], ["CORN", "옥수수", ["C", "O", "Rn"], 1]]], "L-O-P": ["🧠", "신경 탐험가", "자극이 몸속을 달리는 길을 따라가 보는 타입", [["BRAIN", "뇌", ["B", "Ra", "I", "N"], 1], ["SENSE", "감각", ["Se", "N", "Se"], 0], ["THINK", "생각하다", ["Th", "I", "N", "K"], 1], ["TASTE", "맛", ["Ta", "S", "Te"], 0], ["NERVES", "신경", ["N", "Er", "V", "Es"], 0]]], "L-O-A": ["❤️", "몸 지킴이", "우리 몸의 순환과 균형을 지켜보는 타입", [["BODY", "몸", ["B", "O", "Dy"], 0], ["BONES", "뼈", ["B", "O", "Ne", "S"], 1], ["CURE", "치료", ["C", "U", "Re"], 1], ["CARE", "돌봄", ["Ca", "Re"], 0], ["HEALTH", "건강", ["He", "Al", "Th"], 0]]], "E-E-P": ["🌋", "지각 탐사대", "암석을 깨 보고 땅속 움직임을 추적하는 타입", [["ERUPT", "분출하다", ["Er", "U", "Pt"], 0], ["CAVES", "동굴", ["Ca", "V", "Es"], 0], ["ORES", "광석", ["O", "Re", "S"], 0], ["CLIFF", "절벽", ["C", "Li", "F", "F"], 1], ["LAYERS", "지층", ["La", "Y", "Er", "S"], 0]]], "E-E-A": ["⛅", "날씨 예보관", "하늘을 측정하고 내일 날씨를 예측하는 타입", [["RAIN", "비", ["Ra", "I", "N"], 1], ["SNOW", "눈", ["S", "N", "O", "W"], 2], ["WIND", "바람", ["W", "I", "Nd"], 0], ["FOG", "안개", ["F", "Og"], 0], ["ICY", "얼음 같은", ["I", "C", "Y"], 0]]], "E-O-P": ["🔭", "별빛 관측자", "밤하늘을 오래 바라보며 우주의 크기를 재는 타입", [["MOON", "달", ["Mo", "O", "N"], 0], ["SPACE", "우주", ["S", "Pa", "Ce"], 0], ["COSMOS", "우주", ["Co", "S", "Mo", "S"], 4], ["SKY", "하늘", ["S", "K", "Y"], 0], ["COSMIC", "우주의", ["Co", "Sm", "I", "C"], 0]]], "E-O-A": ["🌊", "바다 연구원", "바닷물의 흐름과 변화를 기록하는 타입", [["FISH", "물고기", ["F", "I", "S", "H"], 0], ["CRAB", "게", ["C", "Ra", "B"], 0], ["BEACH", "해변", ["Be", "Ac", "H"], 0], ["SEAS", "바다", ["Se", "As"], 0], ["SCUBA", "스쿠버", ["S", "C", "U", "Ba"], 2]]]};
const DOMAIN={C:'화학 · 물질',P:'물리 · 에너지',L:'생명',E:'지구 · 우주'};
const MQ=[
 {ax:0,q:'과학관에 갔다! 가장 먼저 달려갈 곳은?',a:'⚡ 번개가 번쩍이는 전기 실험관',b:'🦖 공룡 화석과 생태 전시관'},
 {ax:1,q:'선물로 하나만 받을 수 있다면?',a:'🔬 아주 작은 것까지 보이는 현미경',b:'🔭 멀리 있는 별까지 보이는 망원경'},
 {ax:2,q:'새 장난감(기계)을 받았다. 나는?',a:'🔧 일단 이것저것 눌러 보고 분해해 본다',b:'📖 설명서를 먼저 꼼꼼히 읽어 본다'},

function poolFor(type){
  const d=type[0];const out=[];const seen=new Set();
  const add=(x,star)=>{if(seen.has(x[0]))return;seen.add(x[0]);out.push({x,star});};
  TYPES[type][3].forEach(x=>add(x,true));
  Object.keys(TYPES).filter(k=>k[0]===d&&k!==type).forEach(k=>TYPES[k][3].forEach(x=>add(x,false)));
  DOMCATS[d].forEach(c=>{const cat=DICT.find(z=>z[0]===c);if(cat)cat[1].forEach(x=>add(x,false));});
  return out;
}

/* 한글 자판 → 영어 자판 변환 (두벌식) */
const KO2EN={'ㅂ':'q','ㅈ':'w','ㄷ':'e','ㄱ':'r','ㅅ':'t','ㅛ':'y','ㅕ':'u','ㅑ':'i','ㅐ':'o','ㅔ':'p','ㅁ':'a','ㄴ':'s','ㅇ':'d','ㄹ':'f','ㅎ':'g','ㅗ':'h','ㅓ':'j','ㅏ':'k','ㅣ':'l','ㅋ':'z','ㅌ':'x','ㅊ':'c','ㅍ':'v','ㅠ':'b','ㅜ':'n','ㅡ':'m',
 'ㅃ':'Q','ㅉ':'W','ㄸ':'E','ㄲ':'R','ㅆ':'T','ㅒ':'O','ㅖ':'P','ㅘ':'hk','ㅙ':'ho','ㅚ':'hl','ㅝ':'nj','ㅞ':'np','ㅟ':'nl','ㅢ':'ml',
 'ㄳ':'rt','ㄵ':'sw','ㄶ':'sg','ㄺ':'fr','ㄻ':'fa','ㄼ':'fq','ㄽ':'ft','ㄾ':'fx','ㄿ':'fv','ㅀ':'fg','ㅄ':'qt'};
const KL='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ',KV='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ',KT=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function toLatin(s){let o='';for(const ch of s){const c=ch.charCodeAt(0)-0xAC00;
  if(c>=0&&c<=11171){o+=KO2EN[KL[Math.floor(c/588)]]+KO2EN[KV[Math.floor((c%588)/28)]]+(c%28?KO2EN[KT[c%28]]:'');}
  else o+=KO2EN[ch]||ch;}return o;}

    opts=fz.map(o=>({seg:o.seg,exact:false}));
    if(!opts.length){box.innerHTML='<p class="tag" style="font-size:15px">키캡 4칸에 들어가지 않아요. 더 짧은 단어나 이니셜로 바꿔 보세요!</p>';return;}
    head=`<p style="font-weight:700;margin:4px 0">🤏 딱 맞는 조합은 없지만, 이렇게 <b>비슷하게</b> 만들 수 있어요</p>
      <p class="tag" style="font-size:13px">연한 글자는 읽지 않는 글자 (예: <b>M</b><span style="opacity:.35">g</span> → M) · 점선 칸은 주기율표에 없는 <b>상상 원소</b></p>`;
  }
  box.innerHTML=head+opts.slice(0,8).map((o,i)=>`<button class="opt" data-i="${i}"><div class="mini">${miniCaps2(o.seg)}</div><div style="text-align:right"><b>${o.seg.map(capSym).join(' + ')}</b><div class="why">${o.seg.map(capDesc).join(' · ')}${i===0?' · ⭐ 추천':''}</div></div></button>`).join('')+
    (opts.length>8?`<p class="tag">외 ${opts.length-8}가지</p>`:'')+'<p class="tag">마음에 드는 조합을 누르면 만들기 안내로 넘어가요</p>';
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.i];
    renderMake({w:W,mean:'',seg:o.seg,alts:o.exact?exact.length-1:0,emo:'✏️',title:'나만의'});});
}
document.getElementById('mTest').onclick=()=>{setMode('test');Object.assign(S,{i:0,score:[0,0,0,0],hist:[],type:null,word:null,spun:0,rot:0});renderTest();};
document.getElementById('mFree').onclick=()=>renderFree();
document.getElementById('mTable').onclick=()=>renderTable();
renderTable();
</script>
</body>
</html>
