<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>이클립스</title>
<style>
body { margin: 0; background: #000; color: white; font-family: 'Pretendard', -apple-system, sans-serif; overflow: hidden; touch-action: none; }
canvas { display: block; cursor: crosshair; touch-action: none; }
.ui-overlay { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 10; }
.ui-overlay h1 { margin: 0 0 8px 0; font-size: 24px; color: #ffcc00; text-shadow: 0 0 10px rgba(255, 204, 0, 0.5); }
.ui-overlay p { margin: 3px 0; font-size: 14px; color: #bbb; }
.panel-container { position: absolute; right: 20px; top: 20px; display: flex; flex-direction: column; gap: 15px; z-index: 10; }
.panel { background: rgba(0, 0, 0, 0.85); border: 1px solid #444; border-radius: 16px; padding: 12px; text-align: center; backdrop-filter: blur(8px); box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
.panel-title { color: #ffcc00; font-weight: bold; font-size: 11px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
canvas.sub-canvas { background: #000; border-radius: 10px; border: 1px solid #333; cursor: default; }
#eclipseCanvas { position: absolute; top: 0; left: 0; }
.controls-wrapper { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 20; }
.media-controls { display: flex; align-items: center; gap: 12px; background: rgba(20, 20, 25, 0.95); padding: 12px 25px; border-radius: 60px; border: 1px solid #555; box-shadow: 0 10px 40px rgba(0,0,0,0.8); pointer-events: auto; }
.speed-panel { background: rgba(20, 20, 25, 0.85); padding: 8px 22px; border-radius: 30px; border: 1px solid #444; display: flex; align-items: center; gap: 15px; font-size: 13px; pointer-events: auto; }
button { background: #2a2a2a; border: 1px solid #444; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
button:hover { background: #444; transform: scale(1.1); border-color: #666; }
button:active { transform: scale(0.95); }
button.active { background: #ffcc00; color: #000; border-color: #ffcc00; }
button svg { width: 22px; height: 22px; fill: currentColor; }
input[type="range"] { cursor: pointer; width: 110px; accent-color: #ffcc00; }
@media (max-width: 750px) {
  .panel-container { top: 64px; bottom: auto; left: 50%; right: auto; flex-direction: row; align-items: flex-start; gap: 10px; transform: translateX(-50%) scale(0.52); transform-origin: top center; }
  .ui-overlay p:not(:first-of-type) { display: none; }
  .ui-overlay { top: 12px; left: 12px; right: 12px; }
  .ui-overlay h1 { font-size: 18px; }
  .ui-overlay p { font-size: 11px; white-space: nowrap; }
  .controls-wrapper { bottom: 14px; width: 95%; gap: 10px; }
  .speed-panel { padding: 6px 18px; }
  .media-controls { padding: 10px 15px; gap: 8px; }
  button { width: 42px; height: 42px; }
}
@media (max-height: 500px) and (min-width: 501px) {
  .ui-overlay { top: 10px; left: 12px; }
  .ui-overlay h1 { font-size: 16px; margin-bottom: 4px; }
  .ui-overlay p { font-size: 11px; white-space: nowrap; }
  .ui-overlay p:not(:first-of-type) { display: none; }
  .panel-container { top: 10px; right: 10px; bottom: auto; gap: 10px; transform: scale(0.5); transform-origin: top right; }
  .controls-wrapper { bottom: 8px; gap: 6px; transform: translateX(-50%) scale(0.78); transform-origin: bottom center; }
}
</style>
</head>
<body>
<canvas id="eclipseCanvas"></canvas>
<div class="ui-overlay">
  <h1>🌑 이클립스</h1>
  <p>• 관측자(빨간 점)를 드래그하거나 탭해서 그림자 경로에 놓으세요.</p>
  <p>• 개기일식 도달 시 자동으로 멈추며 연출이 시작됩니다.</p>
  <p>• 달 그림자는 지구 자전보다 빨라서 항상 <b style="color:#ffcc00">서쪽 → 동쪽</b>으로 지나갑니다.</p>
</div>
<div class="panel-container">
  <div class="panel"><div class="panel-title">지표면 관측자 시점</div><canvas id="solarCanvas" class="sub-canvas"></canvas></div>
  <div class="panel"><div class="panel-title">우주 배치도 (Top View)</div><canvas id="spaceMapCanvas" class="sub-canvas"></canvas></div>
</div>
<div class="controls-wrapper">
  <div class="media-controls">
    <button id="prevBtn" title="뒤로 이동"><svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg></button>
    <button id="playPauseBtn" class="active" title="재생/일시정지"><svg id="pauseIcon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg><svg id="playIcon" viewBox="0 0 24 24" style="display:none;"><path d="M8 5v14l11-7z"/></svg></button>
    <button id="nextBtn" title="앞으로 이동"><svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg></button>
    <button id="resetBtn" title="처음으로"><svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>
  </div>
  <div class="speed-panel"><span style="color:#ffcc00;font-weight:bold;letter-spacing:1px;">SPEED</span><input type="range" id="speedRange" min="0" max="4" step="0.1" value="1.2"></div>
</div>
<script>
const canvas = document.getElementById('eclipseCanvas'), ctx = canvas.getContext('2d');
const solarCanvas = document.getElementById('solarCanvas'), sctx = solarCanvas.getContext('2d');
const spaceMapCanvas = document.getElementById('spaceMapCanvas'), mctx = spaceMapCanvas.getContext('2d');
const speedInput = document.getElementById('speedRange'), playPauseBtn = document.getElementById('playPauseBtn'),
      prevBtn = document.getElementById('prevBtn'), nextBtn = document.getElementById('nextBtn'),
      resetBtn = document.getElementById('resetBtn'), pauseIcon = document.getElementById('pauseIcon'),
      playIcon = document.getElementById('playIcon');

// ---- 크기 / 고해상도 설정 (매 프레임이 아니라 리사이즈 때만) ----
const SOLAR_W = 240, SOLAR_H = 260, MAP_W = 160, MAP_H = 200;
let W = innerWidth, H = innerHeight, dpr = 1;

function setupCanvas(c, context, w, h) {
  c.width = Math.round(w * dpr);
  c.height = Math.round(h * dpr);
  c.style.width = w + 'px';
  c.style.height = h + 'px';
  context.setTransform(dpr, 0, 0, dpr, 0, 0);
}
let earthArea = { cy: innerHeight / 2, r: Math.min(innerWidth, innerHeight) * .35 };
function layoutEarth() {
  const mobile = innerWidth <= 750 || innerHeight <= 500;
  if (!mobile) { earthArea = { cy: H / 2, r: Math.min(W, H) / 2 * .7 }; return; }
  const top = Math.max(
    document.querySelector('.ui-overlay').getBoundingClientRect().bottom,
    document.querySelector('.panel-container').getBoundingClientRect().bottom) + 8;
  const bottom = document.querySelector('.controls-wrapper').getBoundingClientRect().top - 8;
  const avail = bottom - top;
  if (avail < 120) { earthArea = { cy: H / 2, r: Math.min(W, H) / 2 * .7 }; return; }  // 가로 모드 등 공간 부족
  const cap = 26;                                   // 지구 위 방향 안내 문구 자리
  const r = Math.min(W / 2 * .86, (avail - cap) / 2 * .94);
  earthArea = { cy: top + cap + (avail - cap) / 2, r };
}
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  setupCanvas(canvas, ctx, W, H);
  setupCanvas(solarCanvas, sctx, SOLAR_W, SOLAR_H);
  setupCanvas(spaceMapCanvas, mctx, MAP_W, MAP_H);
  layoutEarth();
  observerX = Math.min(Math.max(observerX, 0), W);
  observerY = Math.min(Math.max(observerY, 0), H);
}

let observerX = innerWidth / 2, observerY = innerHeight / 2;
let moonAngle = 0, isPlaying = true, pauseTime = 0, coronaSeed = Math.random() * 100;
const TOTAL_PAUSE_MS = 3000;

// ---- 지구 렌더러: 실제 대륙 지도(가능하면) + 바다·구름·조명을 직접 그림 ----
const Earth = (() => {
  const TW = 1024, TH = 512, CW = 512, CH = 256;
  const TILT = 22 * Math.PI / 180;          // 북쪽에서 살짝 내려다보는 각도
  let tex = null, clouds = null, ready = false;
  let centerLon = 127;                       // 한반도가 정면에 오도록 시작
  let cloudShift = 0;
  let N = 0, off = document.createElement('canvas'), octx = off.getContext('2d'), img = null;
  let pIdx, pRow, pBase, pShade, pSpec, pRim, count = 0, dirty = true;

  // 3D value noise (구면 좌표로 샘플링해서 경계 이음매 없음)
  function hash(x, y, z) {
    let h = (x * 374761393 + y * 668265263 + z * 2147483647) | 0;
    h = (h ^ (h >>> 13)) * 1274126177 | 0;
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  }
  function noise(x, y, z) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    const xf = x - xi, yf = y - yi, zf = z - zi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
    const l = (a, b, t) => a + (b - a) * t;
    return l(
      l(l(hash(xi, yi, zi), hash(xi + 1, yi, zi), u), l(hash(xi, yi + 1, zi), hash(xi + 1, yi + 1, zi), u), v),
      l(l(hash(xi, yi, zi + 1), hash(xi + 1, yi, zi + 1), u), l(hash(xi, yi + 1, zi + 1), hash(xi + 1, yi + 1, zi + 1), u), v), w);
  }
  function fbm(x, y, z, oct) {
    let s = 0, a = .5, f = 1, n = 0;
    for (let i = 0; i < oct; i++) { s += a * noise(x * f, y * f, z * f); n += a; a *= .5; f *= 2.03; }
    return s / n;
  }
  const sph = (lat, lon) => [Math.cos(lat) * Math.cos(lon), Math.sin(lat), Math.cos(lat) * Math.sin(lon)];

  function blur(src, w, h, r) {
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 2 * r + 1;
    for (let y = 0; y < h; y++) {
      let s = 0;
      for (let i = -r; i <= r; i++) s += src[y * w + ((i + w) % w)];
      for (let x = 0; x < w; x++) {
        tmp[y * w + x] = s / k;
        s += src[y * w + ((x + r + 1) % w)] - src[y * w + ((x - r + w) % w)];
      }
    }
    for (let x = 0; x < w; x++) for (let y = 0; y < h; y++) {
      let s = 0, c = 0;
      for (let i = -r; i <= r; i++) { const yy = y + i; if (yy >= 0 && yy < h) { s += tmp[yy * w + x]; c++; } }
      out[y * w + x] = s / c;
    }
    return out;
  }

  // 대륙 마스크(1=육지)로 색 텍스처 생성. mask가 없으면 노이즈로 가상 대륙 생성
  function buildTexture(mask) {
    if (!mask) {
      mask = new Float32Array(TW * TH);
      for (let j = 0; j < TH; j++) {
        const lat = (90 - (j + .5) / TH * 180) * Math.PI / 180;
        for (let i = 0; i < TW; i++) {
          const p = sph(lat, (i + .5) / TW * 2 * Math.PI);
          mask[j * TW + i] = fbm(p[0] * 1.8 + 9, p[1] * 1.8, p[2] * 1.8, 5) > .54 ? 1 : 0;
        }
      }
    }
    const coast = blur(mask, TW, TH, 7);
    tex = new Uint8ClampedArray(TW * TH * 4);
    for (let j = 0; j < TH; j++) {
      const latD = 90 - (j + .5) / TH * 180, lat = latD * Math.PI / 180, al = Math.abs(latD);
      for (let i = 0; i < TW; i++) {
        const k = j * TW + i, lon = (i + .5) / TW * 2 * Math.PI - Math.PI, p = sph(lat, lon);
        const n = fbm(p[0] * 5, p[1] * 5, p[2] * 5, 4);
        let r, g, b, ocean = 0;
        if (mask[k] > .5) {
          const dry = fbm(p[0] * 2.2 + 3, p[1] * 2.2 + 3, p[2] * 2.2 + 3, 3) + Math.exp(-(((al - 24) / 9) ** 2)) * .22 - Math.exp(-((al / 9) ** 2)) * .16;
          const t = Math.min(1, Math.max(0, (dry - .55) * 3));
          r = 40 + t * 120 + n * 26; g = 86 + t * 46 + n * 26; b = 42 + t * 38 + n * 14;
          if (al > 50) { const c = Math.min(1, (al - 50) / 15); r = r * (1 - c) + 70 * c; g = g * (1 - c) + 88 * c; b = b * (1 - c) + 70 * c; }
          if (al > 66 || latD < -60) { const c = latD < -60 ? 1 : Math.min(1, (al - 66) / 6); r = r * (1 - c) + 236 * c; g = g * (1 - c) + 242 * c; b = b * (1 - c) + 248 * c; }
        } else {
          const sh = Math.min(1, coast[k] * 2.2);
          r = 6 + sh * 22 + n * 10; g = 34 + sh * 60 + n * 14; b = 82 + sh * 62 + n * 18;
          if (al > 72) { const c = Math.min(1, (al - 72) / 8); r += (225 - r) * c; g += (235 - g) * c; b += (245 - b) * c; }
          else ocean = 255;
        }
        tex[k * 4] = r; tex[k * 4 + 1] = g; tex[k * 4 + 2] = b; tex[k * 4 + 3] = ocean;
      }
    }
    clouds = new Uint8Array(CW * CH);
    const cf = new Float32Array(CW * CH);
    for (let j = 0; j < CH; j++) {
      const latD = 90 - (j + .5) / CH * 180, lat = latD * Math.PI / 180;
      for (let i = 0; i < CW; i++) {
        const p = sph(lat, (i + .5) / CW * 2 * Math.PI);
        let c = fbm(p[0] * 3 + 40, p[1] * 6 + 40, p[2] * 3 + 40, 5);
        c += Math.cos(lat * 6) * .04;                       // 위도대별 구름띠
        cf[j * CW + i] = c;
      }
    }
    const cb = blur(cf, CW, CH, 2);
    for (let i = 0; i < CW * CH; i++) { const v = Math.max(0, Math.min(1, (cb[i] - .55) / .2)); clouds[i] = v * v * (3 - 2 * v) * 215; }
    ready = true; dirty = true;
  }

  // 화면 픽셀 → 위도/경도 미리 계산 (크기 바뀔 때만)
  function setSize(diameter) {
    const n = Math.max(64, Math.min(560, Math.round(diameter)));
    if (n === N) return;
    N = n; off.width = off.height = N; img = octx.createImageData(N, N);
    const L = [-.38, .46, .8], ll = Math.hypot(...L); L[0] /= ll; L[1] /= ll; L[2] /= ll;
    const H = [L[0], L[1], L[2] + 1], hl = Math.hypot(...H); H[0] /= hl; H[1] /= hl; H[2] /= hl;
    const cap = N * N;
    pIdx = new Int32Array(cap); pRow = new Int32Array(cap); pBase = new Float32Array(cap);
    pShade = new Float32Array(cap); pSpec = new Float32Array(cap); pRim = new Float32Array(cap);
    count = 0;
    const ct = Math.cos(TILT), st = Math.sin(TILT);
    for (let py = 0; py < N; py++) for (let px = 0; px < N; px++) {
      const x = (px + .5) / N * 2 - 1, y = 1 - (py + .5) / N * 2, d2 = x * x + y * y;
      if (d2 >= 1) continue;
      const z = Math.sqrt(1 - d2);
      const yw = y * ct + z * st, zw = -y * st + z * ct;
      const lat = Math.asin(yw), lon = Math.atan2(x, zw);
      pIdx[count] = (py * N + px) * 4;
      pRow[count] = Math.min(TH - 1, Math.floor((90 - lat * 180 / Math.PI) / 180 * TH));
      pBase[count] = lon / (2 * Math.PI) * TW;
      const dif = Math.max(0, x * L[0] + y * L[1] + z * L[2]);
      pShade[count] = .16 + .98 * Math.pow(dif, .85);
      pSpec[count] = Math.pow(Math.max(0, x * H[0] + y * H[1] + z * H[2]), 60) * 120;
      const edge = Math.min(1, Math.max(0, (Math.sqrt(d2) - .985) / .015));
      pRim[count] = Math.pow(1 - z, 2.4) * .7 + edge * .35;
      count++;
    }
    dirty = true;
  }

  function render() {
    const d = img.data;
    d.fill(0);
    const off0 = (centerLon + 180) / 360 * TW, coff = off0 / 2 + cloudShift;
    for (let k = 0; k < count; k++) {
      let c = Math.floor(pBase[k] + off0) % TW; if (c < 0) c += TW;
      const t = (pRow[k] * TW + c) * 4;
      let cc = Math.floor(pBase[k] / 2 + coff) % CW; if (cc < 0) cc += CW;
      const a = clouds[(pRow[k] >> 1) * CW + cc] / 255;
      const s = pShade[k], rim = Math.min(1, pRim[k]), sp = tex[t + 3] ? pSpec[k] * (1 - a) : 0;
      let r = (tex[t] + (255 - tex[t]) * a * .92) * s + sp;
      let g = (tex[t + 1] + (255 - tex[t + 1]) * a * .92) * s + sp;
      let b = (tex[t + 2] + (255 - tex[t + 2]) * a * .92) * s + sp;
      r += (120 - r) * rim; g += (180 - g) * rim; b += (255 - b) * rim;
      const i = pIdx[k];
      d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = 255;
    }
    octx.putImageData(img, 0, 0);
    dirty = false;
  }

  function rasterize(polys) {
    const c = document.createElement('canvas'); c.width = TW; c.height = TH;
    const x = c.getContext('2d');
    x.fillStyle = '#fff';
    const X = lon => (lon + 180) / 360 * TW, Y = lat => (90 - lat) / 180 * TH;
    for (const poly of polys) {
      for (const shift of [-TW, 0, TW]) {
        x.beginPath();
        for (const r of poly) {
          if (!r.length) continue;
          let lon = r[0][0], tot = 0;
          x.moveTo(X(lon) + shift, Y(r[0][1]));
          for (let i = 1; i < r.length; i++) {
            let dl = r[i][0] - r[i - 1][0];
            if (dl > 180) dl -= 360; else if (dl < -180) dl += 360;
            lon += dl; tot += dl;
            x.lineTo(X(lon) + shift, Y(r[i][1]));
          }
          if (Math.abs(tot) > 180) {             // 남극처럼 극을 감싸는 고리
            const pole = r.reduce((s, p) => s + p[1], 0) < 0 ? -90 : 90;
            x.lineTo(X(lon) + shift, Y(pole));
            x.lineTo(X(r[0][0]) + shift, Y(pole));
          }
          x.closePath();
        }
        x.fill('evenodd');
      }
    }
    const px = x.getImageData(0, 0, TW, TH).data, m = new Float32Array(TW * TH);
    let land = 0;
    for (let i = 0; i < TW * TH; i++) { m[i] = px[i * 4 + 3] > 127 ? 1 : 0; land += m[i]; }
    const frac = land / (TW * TH);
    return frac > .15 && frac < .45 ? m : null;   // 이상한 결과면 버림

let pointerDown = false;
function setObserver(e) {
  const r = canvas.getBoundingClientRect();
  observerX = e.clientX - r.left;
  observerY = e.clientY - r.top;
}
canvas.addEventListener('pointerdown', e => { pointerDown = true; setObserver(e); });
canvas.addEventListener('pointermove', e => { if (pointerDown || e.pointerType === 'mouse') setObserver(e); });
window.addEventListener('pointerup', () => { pointerDown = false; });
window.addEventListener('pointercancel', () => { pointerDown = false; });

function updateUI() {
  pauseIcon.style.display = isPlaying ? 'block' : 'none';
  playIcon.style.display = isPlaying ? 'none' : 'block';
  playPauseBtn.classList.toggle('active', isPlaying);
}
playPauseBtn.onclick = e => { e.stopPropagation(); isPlaying = !isPlaying; updateUI(); };
prevBtn.onclick = e => { e.stopPropagation(); moonAngle += .35; pauseTime = 0; };
nextBtn.onclick = e => { e.stopPropagation(); moonAngle -= .35; pauseTime = 0; };
resetBtn.onclick = e => { e.stopPropagation(); moonAngle = 0; pauseTime = 0; isPlaying = true; updateUI(); };

function drawSpaceMap(a) {
  let w = MAP_W, h = MAP_H, c = w / 2, sy = 30, ey = h - 50, o = 55;
  mctx.clearRect(0, 0, w, h);
  mctx.beginPath(); mctx.arc(c, sy, 15, 0, Math.PI * 2); mctx.fillStyle = '#ffcc00'; mctx.fill();
  mctx.beginPath(); mctx.arc(c, ey, o, 0, Math.PI * 2); mctx.strokeStyle = 'rgba(255,255,255,.1)'; mctx.stroke();
  mctx.beginPath(); mctx.arc(c, ey, 10, 0, Math.PI * 2); mctx.fillStyle = '#1a4a8d'; mctx.fill();
  mctx.beginPath(); mctx.arc(c + Math.cos(a) * o, ey + Math.sin(a) * o, 4, 0, Math.PI * 2); mctx.fillStyle = '#fff'; mctx.fill();
}

function drawHuman(x, y, total) {
  sctx.save();
  sctx.strokeStyle = 'white'; sctx.lineWidth = 2.5; sctx.lineCap = 'round';
  let arm = total ? Math.sin(Date.now() * .006) * 6 - 16 : 0;
  sctx.beginPath(); sctx.arc(x, y - 28, 6, 0, Math.PI * 2); sctx.stroke();
  [[x, y - 22, x, y - 10], [x, y - 20, x - 10, y - 15 + arm], [x, y - 20, x + 10, y - 15 + arm],
   [x, y - 10, x - 6, y + 4], [x, y - 10, x + 6, y + 4]].forEach(p => {
    sctx.beginPath(); sctx.moveTo(p[0], p[1]); sctx.lineTo(p[2], p[3]); sctx.stroke();
  });
  sctx.restore();
}

function drawCorona(x, y, r, i, dt) {
  sctx.save();
  sctx.globalCompositeOperation = 'screen';
  for (let n = 0; n < 85; n++) {
    let a = n / 85 * Math.PI * 2,
        l = r * (1.6 + Math.sin(n * .4 + coronaSeed) * .35 + Math.random() * .15),
        g = sctx.createLinearGradient(x, y, x + Math.cos(a) * l, y + Math.sin(a) * l);
    g.addColorStop(0, `rgba(255,255,255,${.85 * i})`);
    g.addColorStop(.3, `rgba(210,240,255,${.4 * i})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    sctx.beginPath(); sctx.moveTo(x, y); sctx.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l);
    sctx.strokeStyle = g; sctx.lineWidth = 2.2; sctx.stroke();
  }
  let h = sctx.createRadialGradient(x, y, r, x, y, r * 2.8);
  h.addColorStop(0, `rgba(255,255,255,${.9 * i})`);
  h.addColorStop(.2, `rgba(220,240,255,${.55 * i})`);
  h.addColorStop(1, 'rgba(0,0,0,0)');
  sctx.fillStyle = h; sctx.beginPath(); sctx.arc(x, y, r * 2.8, 0, Math.PI * 2); sctx.fill();
  sctx.restore();
  if (isPlaying) coronaSeed += .015 * dt;
}

function drawSolarView(dist, u, p, dx, dy, vis, dt) {
  let cw = SOLAR_W, ch = SOLAR_H, sx = cw / 2, sy = ch * .45, sr = 40;
  sctx.clearRect(0, 0, cw, ch);
  let ax = dx, ay = dy, th = u * .45;
  if (vis && dist < th) { let f = 1 - dist / th; ax *= 1 - f; ay *= 1 - f; }
  let tf = vis && dist < u ? 1 : vis && dist < p ? 1 - dist / p : 0;
  sctx.fillStyle = `rgb(${12 - tf * 12},${12 - tf * 12},${28 - tf * 28})`;
  sctx.fillRect(0, 0, cw, ch);
  sctx.beginPath(); sctx.arc(cw / 2, ch + 400, 440, 0, Math.PI * 2); sctx.fillStyle = '#041408'; sctx.fill();
  drawHuman(cw / 2, ch - 50, tf > .98);
  if (vis) {
    if (tf > .9) {
      let al = (tf - .9) * 10;
      drawCorona(sx, sy, sr, al, dt);
      sctx.beginPath(); sctx.arc(sx, sy, sr + 1.8, 0, Math.PI * 2);
      sctx.strokeStyle = `rgba(255,45,90,${.92 * al})`; sctx.lineWidth = 3.5; sctx.stroke();
    }
    let g = sctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
    g.addColorStop(0, '#fff'); g.addColorStop(.2, '#ffcc00'); g.addColorStop(1, '#ff6600');
    sctx.beginPath(); sctx.arc(sx, sy, sr, 0, Math.PI * 2); sctx.fillStyle = g; sctx.fill();
    let ms = sr * 2.02 / p;
    sctx.beginPath(); sctx.arc(sx + ax * ms, sy - ay * ms, sr + .3, 0, Math.PI * 2); sctx.fillStyle = '#000'; sctx.fill();
  }
}

function pill(text, x, y, fs, align, color) {
  ctx.font = `bold ${fs}px -apple-system, sans-serif`;
  const w = ctx.measureText(text).width + fs * 1.1, h = fs * 1.7;
  const left = align === 'left' ? x : align === 'right' ? x - w : x - w / 2;
  ctx.fillStyle = 'rgba(0,0,0,.62)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(left, y - h / 2, w, h, h / 2); else ctx.rect(left, y - h / 2, w, h);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, left + w / 2, y + .5);
}
function drawDirectionGuide(cx, cy, r, now) {
  const fs = Math.round(Math.max(11, Math.min(14, r * .075)));
  ctx.save();
  // 그림자 경로 점선
  ctx.setLineDash([5, 7]); ctx.strokeStyle = 'rgba(255,204,0,.32)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx - r * .97, cy); ctx.lineTo(cx + r * .97, cy); ctx.stroke();
  ctx.setLineDash([]);
  // 서→동으로 흐르는 화살표
  const phase = isPlaying ? (now / 1800) % 1 : .5;
  ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = 0; i < 4; i++) {
    const f = (i + phase) / 4, x = cx - r * .8 + f * r * 1.6, a = Math.sin(f * Math.PI) * .75;
    ctx.globalAlpha = a; const s = fs * .45;
    ctx.beginPath(); ctx.moveTo(x - s, cy - s); ctx.lineTo(x, cy); ctx.lineTo(x - s, cy + s); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // 서/동 라벨 (지구 가장자리 안쪽)
  pill('서 W', cx - r * .97, cy, fs, 'left', '#fff');
  pill('E 동', cx + r * .97, cy, fs, 'right', '#fff');
  // 지구 위 안내 문구
  pill('🌑 달 그림자 이동: 서 → 동', cx, cy - r - fs * 1.35, fs, 'center', '#ffcc00');
  ctx.restore();
}

      ctx.fillStyle = '#ffcc00'; ctx.textAlign = 'center'; ctx.font = 'bold 28px sans-serif';
      ctx.shadowBlur = 15; ctx.shadowColor = 'rgba(255,204,0,.5)';
      ctx.fillText('✨ TOTAL ECLIPSE ✨', cx, Math.min(140, H * .2));
      ctx.shadowBlur = 0;
    }
  }
  requestAnimationFrame(draw);
}

window.addEventListener('resize', resize);
resize();
observerY = earthArea.cy;
if (document.fonts) document.fonts.ready.then(() => { const old = earthArea.cy; layoutEarth(); if (observerY === old) observerY = earthArea.cy; });
requestAnimationFrame(t => { lastTime = t; draw(t); });
